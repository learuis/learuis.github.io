- title: "1 - Community Rules"
  link: "community"
  description: "The rules below keep our community a safe and healthy place for all of our members. Please read them carefully."
  subsections:
    - point: "1.1"
      title: "AGE"
      details: "As Conan is an 18+ rated game, it is expected that you are at least 18, and your character is at least 18. Underage players and role-playing as an underage character are not permitted."
    - point: "1.2"
      title: "RESPECT"
      details: "Be respectful of other players. If you have an issue with another player, it is your responsibility to be an adult and talk to them about it. If you cannot find resolution, then you can choose to not interact with that player. The moderation team is not here to babysit."
    - point: "1.3"
      title: "THIRST"
      details: "Do not be thirsty, creepy, make inappropriate comments to other members, or DM them without permission. If someone is not responding to your advances, do not persist and make them uncomfortable."
    - point: "1.4"
      title: "(1.4) ERP"
      details: "We are a community of adults and Erotic Roleplay (ERP) between consenting members is permitted. If you engage in ERP please do so privately."
    - point: "1.5"
      title: "HATE / BULLYING"
      details: "Hate speech, racism, sexism, bigotry, racial slurs, and bullying are not permitted and will result in an immediate ban. If your profile, username, or messages contain anything of the above you will be removed."
    - point: "1.6"
      title: "TROLLS"
      details: "Trolls will be banned and sacrificed to the blood god."

- title: "2 - Building Rules"
  link: "building"
  description: "The reality of playing in a shared online environment is that we have a collective responsibility to make the server an enjoyable experience for each other. The following rules are intended to ensure an equitable experience for all players while reducing server lag."
  subsections:
    - point: "2.1"
      title: "BUILDING LOCATION"
      details: "You can build anywhere on the map that the game allows but do not build close to other players without permission. Get permission from the owner of the existing base or look for somewhere else to build. This can be checked with a repeatable process: to check distance, stand at the closest edge of the base, set \"View Distance\" (Under Settings -> Video) to HIGH. Log out and back in. If the other base loads in without you moving, it is considered to be \"within render distance\". If you are unsure, please contact a Moderator."
    - title: "2.2 BUILDING LIMITS"
      details: |
        Each solo player / clan may have:
        • One main base per member
        • One auxiliary base (10x10) TOTAL
        • Three outposts (5x5) TOTAL
        • Total Building Pieces x4000 per member
        • Total Placeable Items x1200 per member

        You can check counts by looking at the clan tab.

        Examples
        2 person clan = 8000 pieces, 2400 items, 2 main bases, 1 aux base, 3 outposts.
        3 person clan = 12000 pieces, 3600 items, 3 main bases, 1 aux base, 3 outposts.
        And so on...

#
#

#2 - BUILDING RULES
#The reality of playing in a shared online environment is that we have a collective responsibility to make the server an enjoyable experience for each other. The following rules are intended to ensure an equitable experience for all players while reducing server lag.
#
#(2.1) BUILDING LOCATION 🗺️
#You can build anywhere on the map that the game allows but do not build close to other players without permission. Get permission from the owner of the existing base or look for somewhere else to build. This can be checked with a repeatable process: to check distance, stand at the closest edge of the base, set "View Distance" (Under Settings -> Video) to HIGH. Log out and back in. If the other base loads in without you moving, it is considered to be "within render distance". If you are unsure, please contact a Moderator.
#
#(2.2) BUILDING LIMITS 🏡
#Each solo player / clan may have:
#• One main base per member
#• One auxiliary base (10x10) TOTAL
#• Three outposts (5x5) TOTAL
#• Total Building Pieces x4000 per member
#• Total Placeable Items x1200 per member
#
#You can check counts by looking at the clan tab.
#
#Examples:
#2 person clan = 8000 pieces, 2400 items, 2 main bases, 1 aux base, 3 outposts.
#3 person clan = 12000 pieces, 3600 items, 3 main bases, 1 aux base, 3 outposts.
#And so on...
#
#(2.3) OUTPOSTS ⛺️
#You may build three (3) outposts. Outposts have the following limits:
#
#• No larger than a 5x5 footprint, top to bottom
#• No taller than 6 blocks in height
#• Any stairs / entrance must fit inside the 5x5 footprint
#• No outposts within render distance of another that you own
#
#Moderators reserve the right to make a ruling on excessive outposts for the best interest of the server.
#
#Outposts do not claim render distance like bases, but must respect the render distance existing player bases. Outposts can be built next to outposts owned by other players. Construction of a new main base by a player does not force existing outposts to move.
#
#(2.4) STRAY OBJECTS
#Placeable objects that are not near your base or aux base are considered to be Outposts.
#A thrall wheel, animal pen, or TP stone placed on the ground is an Outpost and counts toward your limits, even if there are no foundations.
#Bedrolls are an exception and are not Outposts.
#Spamming foundations / pillars to claim land is not allowed.
#
#(2.5) BLOCKING ⛔
#Do not "wall in" resources or block access to them. Do not block the spawn locations of world bosses, animal cubs, or horses. Do not block throughways, paths, or cave entrances. If you build on an important throughway you must provide passage through or around your base.
#
#(2.6) BUILDING LAG MANAGEMENT🧱
#
#Please read the Building Tips forum post for helpful guides and images to demonstrate the best practices for building.
#
#The server is a shared space and excessively large / laggy bases are problematic for the entire community. Be proactive and consider performance around your base. Bases that cause significant drops in FPS for other players may need to be altered. While measurement tools for this are limited, the moderator team reserves the right to make rulings based on the best interests of the entire server.
#
#(2.7) PUT EFFORT INTO YOUR BUILDS
#Help make the server look nice! Put some effort into your buildings and be creative. Do not build giant sandstone cubes. If you struggle with building, there are plenty of guides and tips in discord server to help get you started. There are also many
#helpful players who will be happy to give you some tips.
#(2.8) NEWB RIVER RENDER DISTANCE EXEMPTION
#To allow space for new players to build starter bases in, we have created an exemption to the Render Distance rule for the following map squares: E3, E4, F3, F4, G3, G4, H3, H4, I3, I4, J3, J4. Base built in these squares do not claim "render distance" around them. Please try to be courteous with your placement, but you don't need to go out of render distance to set up your starter base.
#
#(2.9) MAJOR CITY RENDER DISTANCE EXEMPTION
#
#The Render Distance rule will not be enforced in a small radius around major NPC cities, including Summoning Place, The Den, The Mounds, Sepermeru, Buccaneer Bay, and New Asagarth. A map with the boundaries is available on discord. This does not mean that you should build as close to possible to your neighbors, please be courteous. ⁠Outpost-Only and Render Distanc…
#
#(2.10) OUTPOSTS ONLY AT SINKHOLE
#
#The "valley" where the Sinkhole located is a designated space for Outposts only (5x5 size!). It is intended to be a central hub for player Market and Shop builds.
#
